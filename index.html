<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAQI.SHOP - Online Store</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f7f7f7;color:#222}
.top{background:#111;color:#fff;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.top h1{margin:0;font-size:1.3em}
.top a{color:#fcb800;text-decoration:none;margin-left:14px}
.controls{display:flex;gap:8px}
.search input{font-size:.95em}
.wrap{max-width:1400px;margin:0 auto;padding:20px 3%}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
#q{padding:10px 14px;border:1px solid #ddd;border-radius:6px;width:280px;font-size:.95em}
#cat{padding:10px;border:1px solid #ddd;border-radius:6px}
#cartBtn{background:#fcb800;color:#111;border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#fff;border:1px solid #eee;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.1)}
.card img{width:100%;height:200px;object-fit:cover;background:#f4f4f4}
.body{padding:12px;display:flex;flex-direction:column;flex:1}
.cat{font-size:.75em;color:#999;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:.98em;margin:6px 0;min-height:2.6em}
.price{font-weight:800;color:#e02828}
.old{color:#999;text-decoration:line-through;font-weight:400;margin-right:6px}
.rate{font-size:.78em;color:#888;margin-top:2px}
.add{margin-top:auto;background:#111;color:#fff;border:0;border-radius:6px;padding:9px;cursor:pointer;font-size:.9em;margin-top:10px}
.add:hover{background:#fcb800;color:#111}
.add:disabled{background:#ccc;cursor:not-allowed}
.note{font-size:.78em;color:#aaa}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:100}
#modal.open{display:flex}
#modalBox{background:#fff;border-radius:12px;max-width:820px;width:94%;max-height:90vh;overflow:auto;padding:22px}
.pd{display:flex;gap:22px;flex-wrap:wrap}
.pd img{max-width:340px;width:100%;border-radius:10px}
.pinfo{flex:1;min-width:260px}
.qty{display:flex;align-items:center;gap:10px;margin:14px 0}
.qty button{width:34px;height:34px;border:1px solid #ccc;background:#fff;border-radius:6px;font-size:1.1em;cursor:pointer}
.qty input{width:60px;text-align:center;padding:6px;border:1px solid #ccc;border-radius:6px}
.buy{background:#e02828;color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:1.05em;font-weight:700;cursor:pointer}
.buy:hover{opacity:.9}
.close{float:right;background:#eee;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.hint{color:#888;font-size:.8em;margin-top:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fcb800;padding:10px 20px;border-radius:8px;opacity:0;transition:.3s;z-index:200}
#toast.show{opacity:1}
footer{background:#111;color:#888;text-align:center;padding:22px;margin-top:30px;font-size:.85em}
#cartModal .items{max-height:40vh;overflow:auto}
.ci{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;gap:10px}
.ci .nm{flex:1}
.big{border:0;background:#e02828;color:#fff;padding:11px 22px;border-radius:8px;font-size:1em;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.empty{color:#999;text-align:center;padding:30px}
</style></head>
<body>
<div class="top">
  <h1>DAQI.SHOP</h1>
  <div><a href="https://daqi.asia/">Home</a><a href="https://daqi.asia/products">Catalog</a><a href="https://daqi.asia/blog">Blog</a></div>
</div>
<div class="wrap">
  <div class="bar">
    <input id="q" type="search" placeholder="Search products...">
    <select id="cat"><option value="">All categories</option></select>
    <span class="note" id="count"></span>
    <div style="flex:1"></div>
    <button id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<footer>DAQI.SHOP &mdash; static storefront. Images served from Cloudflare R2.</footer>

<div id="modal"><div id="modalBox"><button class="close" onclick="closeModal()">Close</button><div id="modalContent"></div></div></div>

<div id="toast"></div>

<div id="cartModal">
  <div id="cartBox" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:150">
    <div style="background:#fff;border-radius:12px;max-width:560px;width:94%;padding:22px">
      <button class="close" onclick="closeCart()" style="float:right">Close</button>
      <h2>Your Cart</h2>
      <div class="items" id="cartItems"></div>
      <div id="cartTotal"></div>
      <button class="big" id="checkoutBtn" onclick="checkout()">Checkout</button>
      <p class="hint" id="checkoutMsg" style="display:none"></p>
    </div>
  </div>
</div>

<script src="/shop-data.js"></script>
<script>
var PRODUCTS = (typeof SHOP_DATA !== 'undefined') ? SHOP_DATA.products : [];
var CATS = (typeof SHOP_DATA !== 'undefined') ? SHOP_DATA.categories : [];
var cart = JSON.parse(localStorage.getItem('daqi_cart') || '{}');

function renderCats() {
  var s = document.getElementById('cat');
  CATS.forEach(function(c){ var o = document.createElement('option'); o.value = c; o.textContent = c; s.appendChild(o); });
}
function money(v, cur) { return (cur && cur !== 'USD') ? (cur + ' ' + v) : '$' + v.toFixed(2); }
function el(p, i) {
  var price = money(p.price, p.currency);
  var old = (p.regular && p.regular > p.price) ? '<span class="old">' + money(p.regular, p.currency) + '</span>' : '';
  var rate = p.rating ? '<div class="rate">' + '★'.repeat(Math.round(p.rating)) + ' ' + p.rating.toFixed(1) + ' (' + p.reviews + ')</div>' : '';
  var fp = i < 6 ? ' fetchpriority="high"' : '';
  return '<div class="card" data-slug="' + p.slug + '">' +
    '<img loading="' + (i < 2 ? 'eager' : 'lazy') + '" width="400" height="400" decoding="async"' + fp + ' src="' + p.img + '" alt="' + esc(p.name) + '" onerror="this.style.display=\'none\'">' +
    '<div class="body"><span class="cat">' + esc((p.cats||[]).join(' · ')) + '</span>' +
    '<h3>' + esc(p.name) + '</h3>' +
    '<div class="price">' + old + money(p.price, p.currency) + '</div>' + rate +
    '<button class="add" onclick="addToCart(\'' + p.slug + '\')">Add to Cart</button></div></div>';
}
function esc(s){ return (''+s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function renderGrid() {
  var q = (document.getElementById('q').value || '').toLowerCase();
  var c = document.getElementById('cat').value;
  var list = PRODUCTS.filter(function(p){
    if (c && (p.cats||[]).indexOf(c) < 0) return false;
    if (q && (p.name.toLowerCase().indexOf(q) < 0) && (p.desc||'').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  document.getElementById('count').textContent = list.length + ' products';
  document.getElementById('grid').innerHTML = list.map(el).join('');
  document.querySelectorAll('.card').forEach(function(cd){ cd.addEventListener('click', function(e){ if(e.target.classList.contains('add'))return; openModal(cd.dataset.slug); }); });
}
function openModal(slug) {
  var p = PRODUCTS.filter(function(x){return x.slug===slug;})[0];
  if (!p) return;
  var old = (p.regular && p.regular > p.price) ? '<span class="old">' + money(p.regular, p.currency) + '</span>' : '';
  document.getElementById('modalContent').innerHTML =
    '<div class="pd"><img src="' + p.img + '" alt="' + esc(p.name) + '" onerror="this.style.display=\'none\'">' +
    '<div class="pinfo"><h2>' + esc(p.name) + '</h2>' +
    '<div class="price" style="font-size:1.5em">' + old + money(p.price, p.currency) + '</div>' +
    '<div class="qty">Qty: <button onclick="qty(-1)">−</button><input id="qtyI" value="1" type="number" min="1"><button onclick="qty(1)">+</button></div>' +
    '<button class="buy" onclick="addFromModal(\'' + p.slug + '\')">Add to Cart</button>' +
    '<p class="hint">' + esc(p.desc || '') + '</p></div></div>';
  document.getElementById('modal').classList.add('open');
  window._cur = p;
}
function qty(d){ var i=document.getElementById('qtyI'); i.value = Math.max(1, (parseInt(i.value)||1)+d); }
function addFromModal(slug){ var q=parseInt(document.getElementById('qtyI').value)||1; for(var i=0;i<q;i++)addToCart(slug, true); closeModal(); }
function addToCart(slug, silent) {
  var p = PRODUCTS.filter(function(x){return x.slug===slug;})[0];
  if (!p) return;
  cart[slug] = (cart[slug]||0) + 1;
  save(); toast('Added: ' + p.name);
  if (!silent) { document.getElementById('cartBtn').style.transform='scale(1.1)'; setTimeout(function(){document.getElementById('cartBtn').style.transform='';},150); }
}
function save(){ localStorage.setItem('daqi_cart', JSON.stringify(cart)); updateCartCount(); }
function updateCartCount(){ var n=Object.keys(cart).reduce(function(s,k){return s+cart[k];},0); document.getElementById('cartCount').textContent = n; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},1800); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function renderCart() {
  var keys = Object.keys(cart);
  var box = document.getElementById('cartItems'); var total = 0;
  if (!keys.length) { box.innerHTML = '<div class="empty">Your cart is empty.</div>'; document.getElementById('cartTotal').innerHTML=''; return; }
  var html = '';
  keys.forEach(function(k){
    var p = PRODUCTS.filter(function(x){return x.slug===k;})[0];
    if (!p) return;
    var sub = p.price * cart[k]; total += sub;
    html += '<div class="ci"><span class="nm">' + esc(p.name) + ' × ' + cart[k] + '</span><span>$' + sub.toFixed(2) + '</span></div>';
  });
  box.innerHTML = html;
  document.getElementById('cartTotal').innerHTML = '<div style="font-weight:800;font-size:1.2em;padding-top:10px">Total: $' + total.toFixed(2) + '</div>';
}
function openCart(){ renderCart(); document.getElementById('cartBox').style.display='flex'; }
function closeCart(){ document.getElementById('cartBox').style.display='none'; }
function checkout(){
  var keys = Object.keys(cart);
  if (!keys.length) { alert('Cart is empty'); return; }
  var msg = document.getElementById('checkoutMsg');
  msg.style.display = 'block';
  msg.textContent = 'Checkout is a demo on this static storefront. Please contact sales@daqi.shop to place your order. (Order saved to this browser.)';
  cart = {}; save(); renderCart();
}
document.getElementById('cartBtn').onclick = openCart;
document.getElementById('q').oninput = renderGrid;
document.getElementById('cat').onchange = renderGrid;
renderCats(); renderGrid(); updateCartCount();
</script>
</body></html>
